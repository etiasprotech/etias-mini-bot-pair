<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ETIAS-MINI-BOT Deployment</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #18204a 0%, #05060d 45%, #000 100%);
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 480px;
    background: rgba(15, 18, 35, .94);
    border: 1px solid rgba(0, 200, 255, .35);
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 0 35px rgba(0, 200, 255, .12);
}

h1 {
    text-align: center;
    margin: 0 0 8px;
    font-size: 27px;
}

.subtitle {
    text-align: center;
    color: #9ca3af;
    margin-bottom: 25px;
}

label {
    display: block;
    margin: 15px 0 7px;
    color: #cbd5e1;
    font-size: 14px;
}

input,
select {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #30384f;
    background: #090c16;
    color: white;
    outline: none;
    font-size: 15px;
}

input:focus,
select:focus {
    border-color: #00c8ff;
}

button {
    width: 100%;
    margin-top: 22px;
    padding: 15px;
    border: 0;
    border-radius: 10px;
    background: linear-gradient(90deg, #007bff, #00d4ff);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.message {
    display: none;
    margin-top: 18px;
    padding: 14px;
    border-radius: 10px;
    line-height: 1.5;
    font-size: 14px;
}

.success {
    display: block;
    background: rgba(0, 180, 100, .12);
    border: 1px solid #00b464;
}

.error {
    display: block;
    background: rgba(255, 50, 70, .12);
    border: 1px solid #ff3246;
}

.info {
    margin-top: 20px;
    padding: 14px;
    background: rgba(255,255,255,.04);
    border-radius: 10px;
    color: #9ca3af;
    font-size: 13px;
    line-height: 1.6;
}

code {
    color: #00d4ff;
}
</style>
</head>

<body>

<div class="container">

    <h1>🤖 ETIAS-MINI-BOT</h1>

    <div class="subtitle">
        Bot Deployment Panel
    </div>

    <label for="sessionId">Session ID</label>

    <input
        id="sessionId"
        type="text"
        placeholder="ETIAS-MINI-BOT~12345678"
        autocomplete="off"
    >

    <label for="phone">WhatsApp Number</label>

    <input
        id="phone"
        type="tel"
        placeholder="263771234567"
        autocomplete="off"
    >

    <label for="days">Deployment Duration</label>

    <select id="days">
        <option value="1">1 Day</option>
        <option value="7">7 Days</option>
        <option value="30" selected>30 Days</option>
        <option value="60">60 Days</option>
        <option value="90">90 Days</option>
        <option value="180">180 Days</option>
        <option value="365">365 Days</option>
    </select>

    <button id="deployBtn" onclick="deployBot()">
        🚀 DEPLOY BOT
    </button>

    <div id="message" class="message"></div>

    <div class="info">
        <strong>How it works</strong><br><br>

        1. Pair your WhatsApp account first.<br>
        2. Copy the Session ID sent to your WhatsApp.<br>
        3. Enter the Session ID above.<br>
        4. Enter the same WhatsApp number.<br>
        5. Select the deployment duration.<br>
        6. Press <strong>DEPLOY BOT</strong>.<br><br>

        Session format:
        <code>ETIAS-MINI-BOT~12345678</code>
    </div>

</div>

<script>

/*
 * IMPORTANT:
 *
 * Replace this URL with your actual deploy-tenx
 * Render service URL.
 *
 * Example:
 *
 * https://deploy-tenx.onrender.com
 *
 */

const DEPLOY_SERVER =
    "https://deploy-tenx.onrender.com";


async function deployBot() {

    const sessionId =
        document
            .getElementById("sessionId")
            .value
            .trim()
            .toUpperCase();

    const phone =
        document
            .getElementById("phone")
            .value
            .replace(/\D/g, "");

    const days =
        Number(
            document
                .getElementById("days")
                .value
        );

    const button =
        document.getElementById("deployBtn");

    const message =
        document.getElementById("message");


    message.className = "message";
    message.textContent = "";


    if (!/^ETIAS-MINI-BOT~\d{8}$/i.test(sessionId)) {

        message.className =
            "message error";

        message.textContent =
            "Invalid Session ID. It must look like ETIAS-MINI-BOT~12345678.";

        return;
    }


    if (phone.length < 7) {

        message.className =
            "message error";

        message.textContent =
            "Enter a valid WhatsApp phone number.";

        return;
    }


    if (
        DEPLOY_SERVER.includes(
            "YOUR-DEPLOY-TENX-URL"
        )
    ) {

        message.className =
            "message error";

        message.innerHTML =
            "Deployment server URL has not been configured yet.";

        return;
    }


    button.disabled = true;
    button.textContent =
        "⏳ DEPLOYING...";


    message.className =
        "message info";

    message.textContent =
        "Connecting to deployment server...";


    try {

        const response =
            await fetch(
                DEPLOY_SERVER + "/deploy",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        sessionId,
                        phone,
                        days
                    })
                }
            );


        const data =
            await response.json()
                .catch(() => ({}));


        if (!response.ok || !data.success) {

            throw new Error(
                data.error ||
                "Deployment failed."
            );
        }


        message.className =
            "message success";


        message.innerHTML =
            `
            <strong>✅ Deployment successful!</strong><br><br>

            Session:
            <code>${sessionId}</code><br><br>

            Phone:
            <code>${phone}</code><br><br>

            Duration:
            <strong>${days} day(s)</strong><br><br>

            Your ETIAS-MINI-BOT deployment
            has been started.
            `;


    } catch (error) {

        message.className =
            "message error";

        message.textContent =
            "❌ " +
            (
                error.message ||
                "Could not connect to deployment server."
            );

    } finally {

        button.disabled = false;

        button.textContent =
            "🚀 DEPLOY BOT";
    }
}

</script>

</body>
</html>
